name: 签到失败提醒
on:
  workflow_run:
    workflows: ['签到']
    types: [completed]
permissions:
  contents: read
  issues: write
concurrency:
  group: kgm-failure-alert
  cancel-in-progress: false
jobs:
  alert:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 记录异常并提醒仓库所有者
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = '酷狗签到运行异常';
            const body = `运行 #${run.run_number} 未正常完成（${run.conclusion}）。\n${run.html_url}\n请查看失败步骤和脱敏日志。`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(i => !i.pull_request && i.title === title);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body, assignees: [context.repo.owner]});
      - name: 检出提醒代码
        if: ${{ always() }}
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: 创建 Node 环境
        if: ${{ always() }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: 使用现有渠道推送
        if: ${{ always() }}
        run: node scripts/notify-failure.js
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
