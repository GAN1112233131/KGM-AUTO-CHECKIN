name: 签到
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: '仅运行无凭证测试，不领取 VIP'
        type: boolean
        default: false
  schedule:
    - cron: '10 17 * * *'
    # 北京时间 03:37 补偿；今日已成功则跳过。Actions 仍不保证准点。
    - cron: '37 19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: kgm-checkin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 创建 Node 环境
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json

      - name: 无凭证验证
        if: ${{ inputs.validate_only }}
        run: node --test tests/*.test.js

      - name: 调度与防重复检查
        id: schedule
        run: node scripts/schedule.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          VALIDATE_ONLY: ${{ inputs.validate_only }}

      - name: 缓存依赖
        id: cache-npm
        if: ${{ !inputs.validate_only && steps.schedule.outputs.skip != 'true' }}
        uses: actions/cache@v6
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: 安装依赖
        run: npm run install
        if: ${{ !inputs.validate_only && steps.schedule.outputs.skip != 'true' && steps.cache-npm.outputs.cache-hit != 'true' }}

      - name: 执行签到
        if: ${{ !inputs.validate_only && steps.schedule.outputs.skip != 'true' }}
        run: npm run main
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 通知渠道
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          DINGTALK_BOT_KEY: ${{ secrets.DINGTALK_BOT_KEY }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_BOT_KEY: ${{ secrets.FEISHU_BOT_KEY }}
          YUNHU_BOT_KEY: ${{ secrets.YUNHU_BOT_KEY }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_GROUP: ${{ secrets.BARK_GROUP }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
